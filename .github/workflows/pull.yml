name: Refresh timetables

# Daily + manual. Runs unattended:
#   - Studios that pull cleanly are committed straight to main (Netlify publishes).
#   - Studios that fail keep their last-good data (never wiped).
#   - Anything needing a human (a feed down N runs, a profiled teacher dropped) raises
#     a GitHub issue, and it does NOT block the studios that worked.
on:
  schedule:
    - cron: "0 19 * * *"   # Daily 19:00 UTC ≈ 5:00 AM Melbourne (AEST) / 6:00 AM (AEDT)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so the rebase-before-push works cleanly

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Pull + rebuild
        env:
          MINDBODY_API_KEY: ${{ secrets.MINDBODY_API_KEY }}
        run: python pull/pull.py

      # Separate step, and allowed to fail. Events are the newer, more brittle
      # half of the pipeline; an events problem must never take the timetable
      # down with it. This renders whatever data/events.json already holds, which
      # cannot add an event, so it never bypasses Mark's approval. Running it
      # daily is what retires expired cards server-side instead of leaving them
      # in the HTML for a client-side script to hide.
      - name: Re-render the events bands
        continue-on-error: true
        run: python build_events.py

      - name: Publish clean schedule changes
        run: |
          git config user.name  "yim-timetable-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/schedule.json *.html pull/_feed_state.json
          if git diff --cached --quiet; then
            echo "No timetable changes to publish."
            exit 0
          fi
          git commit -m "Auto-refresh teacher timetables from studio feeds"
          # main may have moved (a concurrent commit, or a re-run on an older sha).
          # Rebase onto the latest and retry rather than failing the whole run.
          BR="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$BR" || true
            if git push origin "HEAD:$BR"; then
              echo "Published (attempt $attempt)."
              exit 0
            fi
            echo "Push attempt $attempt rejected; rebasing and retrying..."
            sleep 3
          done
          echo "Could not push after 3 attempts."
          exit 1

      # ------------------------------------------------------------------
      # Keep the Supabase project awake.
      #
      # The free tier pauses a project after 7 days with no activity. The site
      # is static, so the ONLY thing that touches the database is a human
      # pressing Follow or signing up, which means a quiet week pauses it, and
      # a paused project takes the follow buttons on all 13 teacher and studio
      # pages down with it. That is exactly what happened on 28 Aug 2026, and
      # the first Mark heard of it was an email from Supabase.
      #
      # `if: always()` is load-bearing. Without it this step is SKIPPED whenever
      # an earlier step fails, so the ping stops on precisely the days the
      # pipeline is already unhealthy, which is when the project is most likely
      # to drift into a pause unnoticed.
      #
      # continue-on-error, for the same reason the events step has it: a
      # database hiccup must never fail the timetable refresh. The status code
      # is captured to a file and judged in the step below instead, so a failure
      # is loud in the issue rather than silent in a green run.
      # ------------------------------------------------------------------
      - name: Keep Supabase awake
        if: always()
        continue-on-error: true
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          # The publishable (anon) key, which is already public in community.js on
          # every page of the site, so a copy here exposes nothing new. The service
          # key is deliberately NOT used: it bypasses every row-level rule in the
          # database, and keeping a second copy of it in a second system is a second
          # place it can leak from. Row-level security answers an anonymous read with
          # an empty list rather than an error, and an empty 200 is still a database
          # request, which is all the keep-alive needs to be.
          SB_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SB_FALLBACK: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          [ -z "$SB_KEY" ] && SB_KEY="$SB_FALLBACK"
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "000 secrets-missing" > /tmp/sb_status
            echo "SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY are not set as Actions secrets."
            exit 0
          fi
          # A real table read, not a root ping: an API request against actual data
          # is what Supabase counts as activity, and a 404 here would tell us the
          # followers table has gone missing, which is worth knowing on its own.
          # `select=id` rather than `select=email`: nothing readable comes back even
          # if a policy is ever opened up by mistake.
          CODE=$(curl -sS -o /tmp/sb_body -w "%{http_code}" --max-time 30 \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/followers?select=id&limit=1")
          echo "$CODE" > /tmp/sb_status
          echo "supabase followers read -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            head -c 300 /tmp/sb_body || true
          fi

      # Fold any Supabase problem into the SAME anomaly report the timetable pull
      # already uses, so it arrives as one issue rather than a second channel
      # Mark has to remember to watch.
      - name: Record a Supabase problem as an anomaly
        if: always()
        run: |
          CODE=$(cat /tmp/sb_status 2>/dev/null || echo "000 no-status")
          [ "$CODE" = "200" ] && { echo "Supabase healthy."; exit 0; }
          {
            echo ""
            echo "---"
            echo ""
            echo "**🔴 Supabase did not answer (HTTP \`$CODE\`).**"
            echo ""
            echo "While this is failing, the Follow buttons on every teacher and studio"
            echo "page return 502, and \"Join the Community\" sign-up is dead. The contact"
            echo "form still works, since it emails via Brevo and only its logging leg fails."
            echo ""
            case "$CODE" in
              "000 secrets-missing") echo "- The keep-alive never ran: \`SUPABASE_URL\` and/or \`SUPABASE_PUBLISHABLE_KEY\` are not set as **GitHub Actions secrets**. They exist as Netlify env vars, which Actions cannot read, so they must be added separately under Settings → Secrets and variables → Actions. Until then the project is NOT being kept awake." ;;
              000*) echo "- \`000\` means the host did not resolve or the request timed out. A **paused project** looks exactly like this: Supabase tears down the subdomain. Unpause it from the dashboard. Free-tier projects are restorable for 90 days, after which they are not." ;;
              401|403) echo "- Auth was rejected. The service key has been rotated or revoked. Update the \`SUPABASE_SERVICE_KEY\` secret in **both** GitHub Actions and Netlify." ;;
              404) echo "- The project answered but \`public.followers\` is missing. Check the table still exists; re-create it from \`followers-table.sql\` if not." ;;
              5*)  echo "- Supabase returned a server error. Usually transient. If it repeats tomorrow, check status.supabase.com." ;;
            esac
            echo ""
            echo "*Raised by the daily keep-alive in \`.github/workflows/pull.yml\`.*"
          } >> pull/_anomalies.md

      - name: Raise issue on anomalies
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s pull/_anomalies.md ]; then
            echo "No anomalies."
            # A clean run should also clear the board. The attention issue collected
            # 47 comments between August and October because nothing ever closed it,
            # so a resolved problem looked identical to a live one.
            CLEAN=$(gh issue list --state open --search "Timetable pull needs attention in:title" \
              --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$CLEAN" ]; then
              gh issue close "$CLEAN" --comment "Clean run on $(date -u +%F): every feed pulled and no teacher is missing a timetable. Reopens automatically if it recurs." || true
            fi
            exit 0
          fi
          TITLE="⚠ Timetable pull needs attention"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file pull/_anomalies.md
            echo "Appended to existing issue #$NUM."
          else
            gh issue create --title "$TITLE" --body-file pull/_anomalies.md
            echo "Opened a new issue."
          fi
